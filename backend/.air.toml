root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./app"
bin = "./tmp/main"
full_bin = "./tmp/main"
log = "air_errors.log"
include_ext = ["go", "toml", "env"]
exclude_regex = ["_test\\.go"]
exclude_dir = ["tmp"]
delay = 1000

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true